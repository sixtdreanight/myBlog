name: 抓取演出信息

on:
  schedule:
    # UTC+8 8:00-23:30，每60分钟 (cron: minute hour UTC)
    - cron: '0 0-15 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          COMI_EXPORT_PATH: src/data/events.json
        run: python scraper/main.py run

      - name: Commit updated events.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update events'
          file_pattern: 'src/data/events.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
